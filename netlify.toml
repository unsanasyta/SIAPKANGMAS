[build]
  publish = "dist"
  command = "npm run build && node scripts/netlify-dist.mjs"

[build.environment]
  # These variables hold non-sensitive configuration values (bucket names,
  # regions, driver names, app name, public sender address) that legitimately
  # appear in the source code, which triggers false positives in secrets
  # scanning. Real credentials (APP_KEY, DB_PASSWORD, Supabase access keys,
  # API keys, etc.) are intentionally NOT listed so they stay protected.
  # REDIS_PASSWORD is listed only because its value is the literal "null"
  # placeholder, which matches countless "null" tokens in the PHP source.
  # If a real Redis password is ever set, remove it from this list.
  SECRETS_SCAN_OMIT_KEYS = "APP_ENV,APP_DEBUG,APP_NAME,VITE_APP_NAME,APP_LOCALE,APP_FALLBACK_LOCALE,APP_FAKER_LOCALE,APP_MAINTENANCE_DRIVER,AWS_DEFAULT_REGION,AWS_BUCKET,AWS_USE_PATH_STYLE_ENDPOINT,BCRYPT_ROUNDS,BROADCAST_CONNECTION,CACHE_STORE,DB_CONNECTION,DB_PORT,FILESYSTEM_DISK,LOG_CHANNEL,LOG_STACK,LOG_LEVEL,LOG_DEPRECATIONS_CHANNEL,MAIL_FROM_ADDRESS,MEMCACHED_HOST,QUEUE_CONNECTION,REDIS_CLIENT,REDIS_HOST,REDIS_PASSWORD,REDIS_PORT,SESSION_DRIVER,SESSION_ENCRYPT,SESSION_LIFETIME,SESSION_PATH,SESSION_DOMAIN,SUPABASE_COMPLAINTS_BUCKET,SUPABASE_CONSULTATIONS_BUCKET,SUPABASE_DEFAULT_REGION,SUPABASE_KTP_BUCKET,SUPABASE_PROFILE_BUCKET,SUPABASE_SUBMISSIONS_BUCKET"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
